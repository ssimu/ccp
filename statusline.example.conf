# ccp 상태줄 설정 — ~/.config/ccp/statusline.conf 로 복사해서 고친다. 고치면 다음 렌더부터 바로 반영된다.
# ccp status line settings — copy to ~/.config/ccp/statusline.conf. Changes apply on the next redraw.
#
# 미리보기 / preview:   ccp-statusline            (지금 계정과 예시 한도로 그려 본다 / renders with sample quota)
# 통째로 교체 / replace: ~/.config/ccp/statusline.sh 를 만들면 이 설정 대신 그 스크립트가 실행된다.
#                        Create ~/.config/ccp/statusline.sh and it runs instead of the built-in one.

# 무엇을 어떤 순서로 보일지. 빼면 안 보인다. / Which pieces, in which order. Omit to hide.
#   account  프로필:이메일               / profile:email
#   quota    주간·세션 한도 (아래 quota=) / weekly + session quota
#   weekly   주간만                       / weekly only
#   session  세션만                       / session only
#   model    모델 이름                     / model name
#   dir      현재 디렉터리                 / current directory
#   ctx      컨텍스트 사용률               / context window used
#   git      브랜치와 변경 수              / branch and change counts
segments = account quota model dir ctx git

# 조각 사이 구분자 / separator between pieces
separator = " │ "

# 조각 순서 대신 틀을 직접 쓰려면. 비어 있지 않으면 segments/separator 는 무시된다.
# Free-form template. If set, segments/separator are ignored. Placeholders:
#   {account} {quota} {weekly} {session} {model} {dir} {ctx} {git}
# format = "{account} · {weekly} · {session} ▏{model} {dir}"

# 계정 조각의 모양 / account piece. {profile} {email} {user}(@ 앞) {domain}(@ 뒤)
account = "{profile}:{email}"
# account = "{profile}"            # 이메일 없이 / profile only
# account = "{profile} ({user})"

# 한도 조각에 넣을 창과 순서 / which quota windows, in order: weekly session
quota = weekly session

# 숫자를 사용률로 볼지 남은 비율로 볼지 / show used % or remaining %
percent = used                     # used | left

# 막대 칸 수. 0 이면 숫자만. / bar width in cells. 0 = no bar
bar = 5
# 막대 글자: 채운 칸, 빈 칸 / bar characters: filled, empty
bar_chars = "█░"
# bar_chars = "▰▱"
# bar_chars = "#-"

# ↻ 리셋까지 남은 시간 / time until reset
show_reset = yes

# 색이 바뀌는 기준(사용률 %). 첫 값부터 노랑, 둘째 값부터 빨강. 100% 는 굵은 빨강.
# Color thresholds (used %): yellow from the first, red from the second. 100% is bold red.
thresholds = 70 90

# 색을 쓸지 / use ANSI colors
color = yes

# 디렉터리 표시 / how to show the directory: short(~/projects/x) | name(x) | full(/Users/me/projects/x)
dir = short

# 컨텍스트·git 조각의 모양 / templates for ctx and git pieces
ctx = "ctx {pct}%"
git = "git {branch}{changes}"      # {changes} 는 ' [*2+1?3]' 꼴, 변경이 없으면 빈 문자열 / '' when clean

# 문구 언어를 여기서만 따로 정하려면 / override the language for the status line only: ko | en | ja | zh
# lang = en
